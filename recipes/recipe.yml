---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-devos
# description will be included in the image's metadata
description: Bazzite dx image with my customizations.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx-nvidia
image-version: stable # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - minicom
        - virt-viewer
        - kitty

  - type: script
    env:
      KERNEL_MODULE_REQUIRE_SIGNING: "1"
      KERNEL_MODULE_SIGN_KEY: /run/secrets/kernel-module-signing.key
      KERNEL_MODULE_SIGN_CERT: /run/secrets/kernel-module-signing.der
    secrets:
      - type: file
        source: /tmp/kernel-module-signing.key
        mount:
          type: file
          destination: /run/secrets/kernel-module-signing.key
      - type: file
        source: /tmp/kernel-module-signing.der
        mount:
          type: file
          destination: /run/secrets/kernel-module-signing.der
    scripts:
      - build-acp-mic-modules.sh

  - type: systemd
    system:
      enabled:
        - load-acp-mic-modules.service
    user:
      enabled:
        - restart-audio-after-acp-mic.service

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.gnome.Loupe
          - eu.betterbird.Betterbird
          - com.bitwarden.desktop
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
