name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    env:
      KERNEL_MODULE_SIGNING_KEY_SECRET: KERNEL_MODULE_SIGNING_KEY
      KERNEL_MODULE_SIGNING_CERT_SECRET: KERNEL_MODULE_SIGNING_CERT
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe.yml
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare kernel module signing secrets
        shell: bash
        env:
          KERNEL_MODULE_SIGNING_KEY: ${{ secrets[env.KERNEL_MODULE_SIGNING_KEY_SECRET] }}
          KERNEL_MODULE_SIGNING_CERT: ${{ secrets[env.KERNEL_MODULE_SIGNING_CERT_SECRET] }}
        run: |
          set -euo pipefail
          install -m 0600 /dev/null /tmp/kernel-module-signing.key
          install -m 0644 /dev/null /tmp/kernel-module-signing.der
          if [[ -z "${KERNEL_MODULE_SIGNING_KEY}" || -z "${KERNEL_MODULE_SIGNING_CERT}" ]]; then
            echo "Kernel module signing requires KERNEL_MODULE_SIGNING_KEY and KERNEL_MODULE_SIGNING_CERT repository secrets." >&2
            exit 1
          fi
          printf '%s' "${KERNEL_MODULE_SIGNING_KEY}" > /tmp/kernel-module-signing.key
          printf '%s' "${KERNEL_MODULE_SIGNING_CERT}" | base64 --decode > /tmp/kernel-module-signing.der

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.11
        with:
          skip_checkout: true
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
